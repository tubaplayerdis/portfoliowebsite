<!DOCTYPE html>
<html data-bs-theme="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Aaron Wilk - Projects</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Beth+Ellen&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=JetBrains+Mono&display=swap">
    <link rel="stylesheet" href="assets/css/Navbar-Right-Links-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <style>
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            min-height: 0; /* lets children shrink/scroll instead of overflowing the page */
        }

        #MarkdownContent {
            flex: 1 1 auto;
            overflow-y: auto;
        }
    </style>
    <script>
        const API_BASE_URL = 'https://aaronwilk.dev/projectsget';

        document.addEventListener('DOMContentLoaded', () => {
            const buttonBar = document.getElementById('ButtonScrollBar');
            const contentDiv = document.getElementById('MarkdownContent');

            if (!buttonBar) {
                console.error('#ButtonScrollBar element not found in the DOM.');
                return;
            }

            fetch(`${API_BASE_URL}/api/projects`)
                .then((res) => {
                    if (!res.ok) throw new Error(`Failed to fetch project list: ${res.status}`);
                    return res.json();
                })
                .then((projects) => {
                    if (!projects.length) {
                        buttonBar.textContent = 'No projects found.';
                        return;
                    }

                    projects.forEach((project) => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.textContent = project.name; // button text = filename (no .md)
                        btn.classList.add('btn', 'btn-outline-primary', 'flex-shrink-0', 'gap-3');
                        btn.addEventListener('click', () => loadMarkdown(btn.textContent, btn));
                        buttonBar.appendChild(btn);
                    });
                })
                .catch((err) => {
                    console.error(err);
                    buttonBar.textContent = 'Error loading projects.';
                });

            function loadMarkdown(name, btnEl) {
                // Highlight active button (swap outline <-> solid style)
                document.querySelectorAll('#ButtonScrollBar .btn').forEach((b) => {
                    b.classList.remove('btn-primary');
                    b.classList.add('btn-outline-primary');
                });
                btnEl.classList.remove('btn-outline-primary');
                btnEl.classList.add('btn-primary');

                fetch(`${API_BASE_URL}/api/projects/${encodeURIComponent(name)}`)
                    .then((res) => {
                        if (!res.ok) throw new Error(`Failed to fetch ${name}: ${res.status}`);
                        return res.text();
                    })
                    .then((markdownText) => {
                        const rawHtml = marked.parse(markdownText);
                        const cleanHtml = DOMPurify.sanitize(rawHtml); // sanitize before injecting
                        if (contentDiv) {
                            contentDiv.innerHTML = cleanHtml;
                        }
                    })
                    .catch((err) => {
                        console.error(err);
                        if (contentDiv) contentDiv.innerHTML = '<p>Error loading file.</p>';
                    });
            }
        });
    </script>
</head>

<body>
<nav class="navbar navbar-expand-md bg-body py-3">
    <div class="container"><a class="navbar-brand d-flex align-items-center" href="https://aaronwilk.dev"><span style="font-family: 'Beth Ellen', serif;">Aaron Wilk</span></a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navcol-2"><span class="visually-hidden">Toggle navigation</span><span class="navbar-toggler-icon"></span></button>
        <div id="navcol-2" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="about.html" style="font-family: 'JetBrains Mono', monospace;">About</a></li>
                <li class="nav-item"><a class="nav-link" href="https://github.com/tubaplayerdis" target="_blank" style="font-family: 'JetBrains Mono', monospace;">GitHub</a></li>
                <li class="nav-item"></li>
            </ul>
        </div>
    </div>
</nav>

<main>

    <div id="MarkdownContent" class="container py-4">
        <p class="text-muted">Select a project below.</p>
    </div>
    <!-- Add a sidebar for this element with categories of projects then the individual projects themselves. I think the projects should be markdown files and rendered as such -->
    <div class="align-bottom border-top p-2 py-4 container">
        <!-- Horizontally scrollable wrapper -->
        <div class="d-flex flex-nowrap overflow-auto pb-2 scroll-container gap-3" id="ButtonScrollBar">

        </div>
    </div>
</main>

<footer class="text-center bg-body py-4">
    <div class="container"><span style="font-family: 'Beth Ellen', serif;">Aaron Wilk</span></div>
</footer>
<script src="assets/bootstrap/js/bootstrap.min.js"></script>
</body>

</html>
